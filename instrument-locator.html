<title>SP Instrument Locator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d1b2a; color: #e0e8f0; min-height: 100vh; }

  header {
    background: linear-gradient(135deg, #1a3a5c 0%, #0d2640 100%);
    border-bottom: 3px solid #2d7dd2;
    padding: 18px 20px 14px;
    text-align: center;
  }
  header h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: 0.05em; color: #fff; }
  header p { font-size: 0.8rem; color: #7aafd4; margin-top: 3px; letter-spacing: 0.08em; text-transform: uppercase; }

  .search-wrap {
    padding: 16px;
    background: #112036;
    position: sticky; top: 0; z-index: 10;
    border-bottom: 1px solid #1e3a5a;
  }
  .search-wrap input {
    width: 100%; padding: 12px 16px;
    background: #1a3352; border: 2px solid #2d5f9a;
    border-radius: 8px; color: #e0e8f0;
    font-size: 1rem; outline: none;
    transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: #2d7dd2; }
  .search-wrap input::placeholder { color: #4a7aaa; }

  .filters {
    display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap;
  }
  .filter-btn {
    padding: 5px 12px; border-radius: 20px; border: 1px solid #2d5f9a;
    background: transparent; color: #7aafd4; font-size: 0.75rem;
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .filter-btn.active, .filter-btn:hover {
    background: #2d7dd2; border-color: #2d7dd2; color: #fff;
  }

  #results-count {
    padding: 8px 16px; font-size: 0.75rem; color: #4a7aaa;
  }

  #results { padding: 0 12px 80px; }

  .result-card {
    background: #152a45; border: 1px solid #1e3f6a;
    border-radius: 10px; margin-bottom: 10px; padding: 14px;
    transition: border-color 0.15s;
  }
  .result-card:hover { border-color: #2d7dd2; }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .item-name { font-weight: 700; font-size: 0.95rem; color: #ddeeff; line-height: 1.3; flex: 1; }
  .qty-badge {
    background: #1e3f6a; border: 1px solid #2d5f9a;
    border-radius: 5px; padding: 2px 8px;
    font-size: 0.7rem; color: #7aafd4; white-space: nowrap;
  }
  .qty-badge.overflow { border-color: #f0a500; color: #f0c040; background: #2a2000; }

  .location-row { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .loc-tag {
    display: inline-flex; align-items: center; gap: 4px;
    background: #0d2640; border: 1px solid #1a4a7a;
    border-radius: 5px; padding: 3px 9px; font-size: 0.72rem;
  }
  .hanel-label { color: #2d7dd2; font-weight: 700; }
  .shelf-label { color: #7aafd4; }
  .category-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }

  .cat-tag {
    font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em;
    padding: 2px 7px; border-radius: 10px; font-weight: 700;
  }
  .cat-neuro { background: #1a0a3a; color: #9d60f0; border: 1px solid #5a2ab0; }
  .cat-ortho { background: #0a2a0a; color: #40c060; border: 1px solid #1a6a2a; }
  .cat-gen   { background: #1a1a00; color: #d0a020; border: 1px solid #6a5000; }
  .cat-cvts  { background: #2a0a0a; color: #f06060; border: 1px solid #8a1a1a; }
  .cat-peelpacks { background: #0a1a2a; color: #40a0d0; border: 1px solid #1a5a8a; }
  .cat-eye   { background: #1a0a1a; color: #d060d0; border: 1px solid #6a1a6a; }
  .cat-ent   { background: #1a1a0a; color: #c0c040; border: 1px solid #6a6a00; }
  .cat-vascular { background: #2a0a0a; color: #f08040; border: 1px solid #8a3000; }
  .cat-lap   { background: #0a2a2a; color: #40d0c0; border: 1px solid #006a60; }
  .cat-spine { background: #1a0a2a; color: #a060e0; border: 1px solid #501a8a; }
  .cat-gyn   { background: #2a0a1a; color: #f060a0; border: 1px solid #a0205a; }
  .cat-uro   { background: #0a1a2a; color: #40c0f0; border: 1px solid #0060a0; }
  .cat-robotics { background: #1a0a2a; color: #c080f0; border: 1px solid #6020b0; }

  .no-results {
    text-align: center; padding: 50px 20px; color: #4a7aaa;
  }
  .no-results .icon { font-size: 3rem; margin-bottom: 12px; }

  mark { background: #2d7dd2; color: #fff; border-radius: 2px; padding: 0 1px; }
</style>

  uro:       { label:"Uro",        cls:"cat-uro",       color:"#40c0f0" },
  robotics:  { label:"Robotics",   cls:"cat-robotics",  color:"#c080f0" },
  eye:       { label:"Eye",        cls:"cat-eye",       color:"#d060d0" },
};

let activeFilter = "all";
const searchInput = document.getElementById("searchInput");
const resultsDiv  = document.getElementById("results");
const countDiv    = document.getElementById("results-count");

function highlight(text, query) {
  if (!query) return text;
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');
}

function locationLabel(item) {
  const h = `Hanel ${item.hanel}`;
  const s = item.side ? ` Side ${item.side}` : "";
  const sh = item.shelf ? ` · Shelf ${item.shelf}` : "";
  return { hanel: h + s, shelf: sh.replace(" · ", "") };
}

function render() {
  const q = searchInput.value.trim().toLowerCase();
  const words = q ? q.split(/\s+/) : [];

  let filtered = DB.filter(item => {
    const catMatch = activeFilter === "all" || item.cats.includes(activeFilter);
    if (!catMatch) return false;
    if (!words.length) return true;
    const haystack = item.name.toLowerCase();
    return words.every(w => haystack.includes(w));
  });

  countDiv.textContent = filtered.length
    ? `${filtered.length} result${filtered.length !== 1 ? 's' : ''}`
    : "";

  if (!filtered.length) {
    resultsDiv.innerHTML = `<div class="no-results"><div class="icon">🔍</div><p>No items found.<br>Try a different search or filter.</p></div>`;
    return;
  }

  resultsDiv.innerHTML = filtered.map(item => {
    const loc = locationLabel(item);
    const isOverflow = item.qty === "Overflow" || item.qty === "overflow";
    const qtyHtml = item.qty
      ? `<span class="qty-badge${isOverflow ? ' overflow' : ''}">Qty: ${item.qty}</span>`
      : "";

    const catTags = item.cats.map(c => {
      const ci = catInfo[c];
      return ci ? `<span class="cat-tag ${ci.cls}">${ci.label}</span>` : "";
    }).join("");

    return `
      <div class="result-card">
        <div class="card-top">
          <div class="item-name">${highlight(item.name, q)}</div>
          ${qtyHtml}
        </div>
        <div class="location-row">
          <span class="loc-tag">
            <span class="hanel-label">${loc.hanel}</span>
            ${loc.shelf ? `<span class="shelf-label">· ${loc.shelf}</span>` : ""}
          </span>
          ${catTags}
        </div>
      </div>`;
  }).join("");
}

// Filter buttons
document.getElementById("filterBar").addEventListener("click", e => {
  const btn = e.target.closest(".filter-btn");
  if (!btn) return;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  activeFilter = btn.dataset.filter;
  render();
});

searchInput.addEventListener("input", render);

// Initial render — show all
render();
